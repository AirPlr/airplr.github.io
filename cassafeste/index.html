<!DOCTYPE html>
<html>
<head>
    <!-- Document metadata -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>54ª Sagra della Patata - Cassa</title>

    <!-- External stylesheets -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AirPlr/airplr.github.io/cassafeste/styles.css" type="text/css">
</head>
<body>
    <div class="container">
        <!-- Page title -->
        <h1>54ª Sagra della Patata</h1>

        <!-- Checkout section -->
        <h2>Checkout</h2>

        <!-- Form -->
        <form>
            <h3>Da Mangiare</h3>

            <!-- Gnocchi input -->
            <div class="form-group">
                <label for="gnocchi">Gnocchi <span class="price">6€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('gnocchi')">
                    <input type="number" id="gnocchi" name="gnocchi" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('gnocchi')">
                </div>
            </div>

            <!-- Panino con salsiccia input -->
            <div class="form-group">
                <label for="paninoSalsiccia">Panino con salsiccia <span class="price">4€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('paninoSalsiccia')">
                    <input type="number" id="paninoSalsiccia" name="paninoSalsiccia" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('paninoSalsiccia')">
                </div>
            </div>

            <!-- Arrosticini input: sold in units of 5 (6€ per 5pz) -->
            <div class="form-group">
                <label for="arrosticini">Arrosticini 5pz <span class="price">6€</span></label>
                <div class="stepper">
                    <input type="button" value="-5" onclick="decrementValue('arrosticini', 5)">
                    <input type="number" id="arrosticini" name="arrosticini" min="0" step="5" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+5" onclick="incrementValue('arrosticini', 5)">
                </div>
            </div>

            <!-- Patatine fritte input -->
            <div class="form-group">
                <label for="patatineFritte">Patatine fritte <span class="price">3€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('patatineFritte')">
                    <input type="number" id="patatineFritte" name="patatineFritte" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('patatineFritte')">
                </div>
            </div>

            <!-- Ciambella input -->
            <div class="form-group">
                <label for="ciambella">Ciambella <span class="price">3€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('ciambella')">
                    <input type="number" id="ciambella" name="ciambella" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('ciambella')">
                </div>
            </div>

            <!-- Frittella input -->
            <div class="form-group">
                <label for="frittella">Frittella dolce o salata <span class="price">2€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('frittella')">
                    <input type="number" id="frittella" name="frittella" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('frittella')">
                </div>
            </div>

            <!-- Pizza con patate input -->
            <div class="form-group">
                <label for="pizzaPatate">Pizza con patate <span class="price">2€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('pizzaPatate')">
                    <input type="number" id="pizzaPatate" name="pizzaPatate" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('pizzaPatate')">
                </div>
            </div>

            <h3>Da Bere</h3>

            <!-- Birra alla spina input -->
            <div class="form-group">
                <label for="birraSpina">Birra alla spina 0,3 <span class="price">4€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('birraSpina')">
                    <input type="number" id="birraSpina" name="birraSpina" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('birraSpina')">
                </div>
            </div>

            <!-- Bicchiere di vino input -->
            <div class="form-group">
                <label for="bicchiereVino">Bicchiere di vino <span class="price">2€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('bicchiereVino')">
                    <input type="number" id="bicchiereVino" name="bicchiereVino" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('bicchiereVino')">
                </div>
            </div>

            <!-- Brocca di vino 1L input -->
            <div class="form-group">
                <label for="broccaVino">Brocca di vino 1L <span class="price">10€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('broccaVino')">
                    <input type="number" id="broccaVino" name="broccaVino" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('broccaVino')">
                </div>
            </div>

            <!-- Acqua input -->
            <div class="form-group">
                <label for="acqua">Acqua <span class="price">1€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('acqua')">
                    <input type="number" id="acqua" name="acqua" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('acqua')">
                </div>
            </div>

            <!-- Bibite lattine input -->
            <div class="form-group">
                <label for="bibiteLattine">Bibite lattine <span class="price">3€</span></label>
                <div class="stepper">
                    <input type="button" value="-" onclick="decrementValue('bibiteLattine')">
                    <input type="number" id="bibiteLattine" name="bibiteLattine" min="0" value="0" onchange="calculateTotalPrice()">
                    <input type="button" value="+" onclick="incrementValue('bibiteLattine')">
                </div>
            </div>
        </form>
    </div>

    <!-- Sticky total bar -->
    <div class="total-bar">
        <span class="total-price">Total Price: €0.00</span>
        <button type="button" class="reset-btn" onclick="resetForm()">Reset</button>
    </div>

    <!-- JavaScript code -->
    <script>
        // Function to reset form
        function resetForm() {
            document.getElementById("gnocchi").value = 0;
            document.getElementById("paninoSalsiccia").value = 0;
            document.getElementById("arrosticini").value = 0;
            document.getElementById("patatineFritte").value = 0;
            document.getElementById("ciambella").value = 0;
            document.getElementById("frittella").value = 0;
            document.getElementById("pizzaPatate").value = 0;
            document.getElementById("birraSpina").value = 0;
            document.getElementById("bicchiereVino").value = 0;
            document.getElementById("broccaVino").value = 0;
            document.getElementById("acqua").value = 0;
            document.getElementById("bibiteLattine").value = 0;
            calculateTotalPrice();
        }

        // Function to calculate total price
        function calculateTotalPrice() {
            // Prices per item
            var prices = {
                gnocchi: 6.00,
                paninoSalsiccia: 4.00,
                arrosticini: 6.00 / 5, // sold in units of 5 for 6€
                patatineFritte: 3.00,
                ciambella: 3.00,
                frittella: 2.00,
                pizzaPatate: 2.00,
                birraSpina: 4.00,
                bicchiereVino: 2.00,
                broccaVino: 10.00,
                acqua: 1.00,
                bibiteLattine: 3.00
            };

            // Calculate total price
            var totalPrice = 0;
            for (var itemId in prices) {
                var quantity = parseInt(document.getElementById(itemId).value) || 0;
                totalPrice += prices[itemId] * quantity;
            }

            // Update total price display
            document.querySelector('.total-price').textContent = 'Total Price: €' + totalPrice.toFixed(2);
        }

        // Function to increment value
        function incrementValue(inputId, step) {
            step = step || 1;
            var input = document.getElementById(inputId);
            input.value = parseInt(input.value) + step;
            calculateTotalPrice();
        }

        // Function to decrement value
        function decrementValue(inputId, step) {
            step = step || 1;
            var input = document.getElementById(inputId);
            input.value = Math.max(0, parseInt(input.value) - step);
            calculateTotalPrice();
        }
    </script>
</body>
</html>
